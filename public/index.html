<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Duel</title>
<style>
:root{--bg:#eef0f6;--fg:#171a2b;--card:#fff;--mut:#646a85;--ac:#5b3df5;--ac2:#00a884;--bd:#d6d9e8;--arena:#1a1633}
@media (prefers-color-scheme:dark){:root{--bg:#10121d;--fg:#eceefa;--card:#1b1e30;--mut:#9aa0bd;--bd:#32364f;--arena:#090a14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
#app{max-width:880px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.2rem;margin:.3em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:.9rem}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac);color:#fff;font-size:.8rem}
canvas{background:#fff;border:2px solid var(--bd);border-radius:12px;touch-action:none;width:100%;max-width:360px;aspect-ratio:1}
.draw{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:16px}
@media(max-width:700px){.draw{grid-template-columns:1fr}}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid var(--bd)}
.sw.on{outline:3px solid var(--ac2)}
.st{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin:6px 0}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.arena{background:radial-gradient(ellipse at 50% 100%,#4a3a99,var(--arena) 70%);border-radius:16px;padding:22px 10px;display:flex;justify-content:space-around;align-items:center;min-height:260px;overflow:hidden}
.fg{width:42%;max-width:260px;text-align:center;color:#fff}
.fg img{width:100%;background:#fff;border-radius:14px;display:block}
.fg.l{animation:cl 1.2s ease-in-out infinite}.fg.r{animation:cr 1.2s ease-in-out infinite}
@keyframes cl{50%{transform:translateX(28%) rotate(6deg)}}@keyframes cr{50%{transform:translateX(-28%) rotate(-6deg)}}
@media(prefers-reduced-motion:reduce){.fg.l,.fg.r{animation:none}}
.vs{font-size:2rem;color:#fff;font-weight:800}
.fg.win{animation:none}.fg.win img{box-shadow:0 0 0 4px gold,0 0 30px gold}.fg.lose{animation:none;opacity:.45;filter:grayscale(.8)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mon{text-align:center}.mon img{width:100%;max-width:240px;background:#fff;border-radius:12px;border:1px solid var(--bd)}
.pick{cursor:pointer;border:2px solid var(--bd);border-radius:12px;padding:8px}.pick:hover{border-color:var(--ac)}
.big{font-size:2.4rem;letter-spacing:.3em;font-weight:800}
.sc{display:grid;grid-template-columns:130px 1fr 1fr;gap:6px;align-items:center;font-size:.9rem}
</style></head>
<body><div id="app"><p class="mut">Conectando…</p></div>
<script>
const app=document.getElementById('app');
const CL={C:25,B:50,A:100},ORD=['C','B','A'];
const SK=['atk','def','vel','int','pod'],SN=['Ataque','Defesa','Velocidade','Inteligência','Poder especial'];
const CR=[['ataque','Ataque'],['defesa','Defesa'],['velocidade','Velocidade'],['inteligencia','Inteligência'],['poder','Poder especial'],['aparencia','Aparência/intimidação'],['criatividade','Criatividade']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pn=p=>p==='p1'?'Jogador 1':'Jogador 2',other=p=>p==='p1'?'p2':'p1';
let pid;try{pid=localStorage.getItem('md_pid')}catch(e){}
if(!pid){pid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());try{localStorage.setItem('md_pid',pid)}catch(e){}}
let ws,S=null,viewKey='',wantCode=location.hash.slice(1).toUpperCase(),notice='';
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));

function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{if(wantCode)send({t:'join',code:wantCode,pid});else if(!S)home()};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='state'){S=m.s;wantCode=S.code;try{location.hash=S.code}catch(x){}render()}
    if(m.t==='error'){notice=m.msg;wantCode='';viewKey='';S?render():home()}};
  ws.onclose=()=>setTimeout(connect,1500);
}
function home(){
  viewKey='home';
  app.innerHTML=`<h1>👾 Monster Duel</h1><p class="mut">Desenhe 3 monstros (classes C, B e A), distribua pontos e deixe a IA julgar os duelos. O vencedor absorve traços do rival e evolui.</p>
  ${notice?`<div class="card" role="alert">${esc(notice)}</div>`:''}
  <div class="card"><h2>Novo jogo</h2><button id="cr">Criar sala</button></div>
  <div class="card"><h2>Entrar numa sala</h2><div class="row"><input type="text" id="cd" maxlength="4" placeholder="CÓDIGO" style="max-width:160px;text-transform:uppercase"><button id="jn">Entrar</button></div></div>`;
  notice='';
  document.getElementById('cr').onclick=()=>send({t:'create',pid});
  document.getElementById('jn').onclick=()=>{const v=document.getElementById('cd').value.trim().toUpperCase();if(v.length===4){wantCode=v;send({t:'join',code:v,pid})}};
}
const bars=m=>SK.map((k,i)=>`<div class="st" style="margin:2px 0"><span class="mut">${SN[i]}</span><div class="bar"><i style="width:${Math.min(100,m.stats[k]/m.overall*200)}%"></i></div><b>${m.stats[k]}</b></div>`).join('');
const monCard=m=>`<div class="mon"><img src="${m.img}" alt=""><div><b>${esc(m.name)}</b> <span class="tag">Classe ${m.cls} · OVR ${m.overall}</span></div>${bars(m)}</div>`;
const fighter=(p,cls,extra='')=>{const m=S.mons[S.choice[p]];return m?`<div class="fg ${cls} ${extra}"><img src="${m.img}" alt=""><div><b>${esc(m.name)}</b><br><small>${pn(p)} · OVR ${m.overall}</small></div></div>`:''};
const arena=(a='',b='')=>`<div class="arena">${fighter('p1','l',a)}<div class="vs">⚔️</div>${fighter('p2','r',b)}</div>`;
const head=()=>`<div class="row" style="justify-content:space-between"><h1>👾 Monster Duel</h1><div class="mut">Sala <b>${S.code}</b> · Você: ${S.me?pn(S.me):'espectador'} · Vitórias ${S.wins.p1} × ${S.wins.p2}</div></div>`;

function render(){
  if(!S)return;
  const m=S.me,st=S.stage;
  const mine=ORD.filter(c=>S.mons[m+'_'+c]).length;
  const key=[st,S.round,mine,m,S.choice.p1,S.choice.p2,!!S.res,S.busy,S.err,S.joined,Object.keys(S.mons).length].join('|');
  if(key===viewKey)return;viewKey=key;
  if(st==='lobby')return void(app.innerHTML=head()+`<div class="card" style="text-align:center"><p>Passe este código para o outro jogador:</p><div class="big">${S.code}</div><p class="mut">Ele deve abrir este site e escolher “Entrar numa sala”. Aguardando…</p></div>`);
  if(!m)return void(app.innerHTML=head()+'<div class="card">Esta sala já tem dois jogadores.</div>');
  if(st==='draw')return mine>=3?void(app.innerHTML=head()+`<div class="card"><h2>✅ Seus 3 monstros estão prontos</h2><p class="mut">Aguardando o outro jogador terminar (${S.theirCount}/3)…</p></div>`):drawView(ORD.find(c=>!S.mons[m+'_'+c]),mine);
  if(st==='pick')return pickView(m);
  if(st==='judging'){
    app.innerHTML=head()+`<h2>Rodada da Classe ${S.round}: duelo!</h2>${arena()}`+(S.err?`<div class="card" role="alert">A IA falhou: ${esc(S.err)}. <button id="rt">Tentar de novo</button></div>`:`<div class="card">🧠 A IA está avaliando os desenhos${S.round==='A'?'':' e gerando a evolução do vencedor'}… pode levar cerca de um minuto.</div>`);
    const b=document.getElementById('rt');if(b)b.onclick=()=>send({t:'retry'});return}
  if(st==='result')return resultView();
  if(st==='end')return endView();
}
function drawView(cls,step){
  const cap=CL[cls];
  app.innerHTML=head()+`<h2>Desenhe seu monstro da Classe ${cls} <span class="tag">${step+1}/3 · até ${cap} pontos</span></h2>
  <div class="draw"><div><canvas id="cv" width="360" height="360"></canvas>
  <div class="row" style="margin-top:8px" id="pal"></div>
  <div class="row" style="margin-top:8px"><input type="range" id="sz" min="2" max="30" value="6" style="flex:1" aria-label="Espessura"><button class="sec" id="er">Borracha</button><button class="sec" id="cl">Limpar</button></div></div>
  <div><input type="text" id="nm" maxlength="30" placeholder="Nome do monstro" aria-label="Nome do monstro">
  <p class="mut">Pontos restantes: <b id="rem">${cap}</b></p>
  ${SK.map((k,i)=>`<div class="st"><span>${SN[i]}</span><input type="range" min="0" max="${cap}" value="0" data-k="${i}" aria-label="${SN[i]}"><b id="v${i}">0</b></div>`).join('')}
  <button id="sv" style="margin-top:10px" disabled>Salvar monstro</button></div></div>`;
  const cv=document.getElementById('cv'),x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,360,360);x.lineCap=x.lineJoin='round';
  let col='#111',er=false,down=false,drew=false;
  ['#111','#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#8e5a2b','#7f8c8d'].forEach((c,i)=>{
    const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.setAttribute('aria-label','Cor '+c);
    b.onclick=()=>{col=c;er=false;document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));b.classList.add('on')};
    document.getElementById('pal').appendChild(b)});
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*360/r.width,(e.clientY-r.top)*360/r.height]};
  cv.onpointerdown=e=>{down=true;drew=true;cv.setPointerCapture(e.pointerId);const[a,b]=pos(e);x.strokeStyle=er?'#fff':col;x.lineWidth=+document.getElementById('sz').value;x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke();chk()};
  cv.onpointermove=e=>{if(!down)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  document.getElementById('er').onclick=()=>{er=!er};
  document.getElementById('cl').onclick=()=>{x.fillStyle='#fff';x.fillRect(0,0,360,360);drew=false;chk()};
  const sl=[...document.querySelectorAll('input[data-k]')];
  const used=()=>sl.reduce((s,i)=>s+ +i.value,0);
  function chk(){document.getElementById('sv').disabled=!(drew&&used()>0&&document.getElementById('nm').value.trim())}
  sl.forEach(i=>i.oninput=()=>{const o=used()-i.value;if(o+ +i.value>cap)i.value=cap-o;document.getElementById('v'+i.dataset.k).textContent=i.value;document.getElementById('rem').textContent=cap-used();chk()});
  document.getElementById('nm').oninput=chk;
  document.getElementById('sv').onclick=()=>{
    const b=document.getElementById('sv');b.disabled=true;b.textContent='Salvando…';
    const stats={};SK.forEach((k,i)=>stats[k]=+sl[i].value);
    send({t:'save',cls,name:document.getElementById('nm').value.trim(),stats,img:cv.toDataURL('image/png')});
  };
}
function pickView(m){
  const opts=S.options;let body;
  if(S.choice[m])body='<div class="card">Escolha feita. Aguardando o outro jogador…</div>';
  else if(opts.length>1)body=`<div class="card"><h2>🏆 Você venceu a rodada anterior! Escolha seu lutador da Classe ${S.round}</h2><div class="grid2">${opts.map(id=>S.mons[id]?`<div class="pick" data-id="${id}" tabindex="0" role="button">${monCard(S.mons[id])}<p class="mut" style="text-align:center">${S.mons[id].evolved?'Evoluído (absorveu: '+esc(S.mons[id].trait)+')':'Desenho original'}</p></div>`:'').join('')}</div></div>`;
  else body='<div class="card">Você usará seu desenho original. Aguardando o outro jogador escolher…</div>';
  app.innerHTML=head()+`<h2>Rodada da Classe ${S.round}</h2>`+body;
  document.querySelectorAll('.pick').forEach(e=>{const go=()=>send({t:'pick',id:e.dataset.id});e.onclick=go;e.onkeydown=k=>{if(k.key==='Enter'||k.key===' ')go()}});
}
function resultView(){
  const r=S.res,w=r.winner,a=S.mons[S.choice[w]],evo=r.evoId&&S.mons[r.evoId];
  const tot=p=>CR.reduce((s,[k])=>s+(+r.scores[p][k]||0),0);
  app.innerHTML=head()+`<h2>🏆 ${pn(w)} vence a rodada ${S.round}!</h2>${arena(w==='p1'?'win':'lose',w==='p2'?'win':'lose')}
  <div class="card"><p>${esc(r.verdict)}</p><div class="sc"><b></b><b>${pn('p1')} (${tot('p1')})</b><b>${pn('p2')} (${tot('p2')})</b>
  ${CR.map(([k,n])=>`<span>${n}</span><span>${r.scores.p1[k]}/10</span><span>${r.scores.p2[k]}/10</span>`).join('')}</div></div>
  ${evo?`<div class="card"><h2>🧬 Evolução: absorveu “${esc(r.trait)}”</h2><div class="grid2">${monCard(a)}${monCard(evo)}</div><p class="mut">Overall ${a.overall} → ${evo.overall}. Na próxima rodada o vencedor escolhe entre o evoluído e o desenho original.</p></div>`:''}
  <button id="nx">${S.round==='A'||S.wins[w]>=2?'Ver campeão':'Próxima rodada'}</button>`;
  document.getElementById('nx').onclick=()=>send({t:'next'});
}
function endView(){
  const c=S.champ,evos=Object.values(S.mons).filter(x=>x.owner===c&&x.evolved).sort((a,b)=>a.overall-b.overall),fin=S.mons[S.choice[c]];
  app.innerHTML=head()+`<div class="card" style="text-align:center"><div class="big">🏆</div><h1>${pn(c)} é o campeão${S.me===c?' — parabéns, você!':'!'}</h1><p class="mut">Placar final: ${S.wins.p1} × ${S.wins.p2}</p></div>
  <div class="card"><h2>A jornada evolutiva do monstro campeão</h2><div class="grid2">${evos.map(monCard).join('')}${fin&&!fin.evolved?monCard(fin):''}</div></div>
  <button class="sec" onclick="location.hash='';location.reload()">Novo jogo</button>`;
}
connect();
</script></body></html>
